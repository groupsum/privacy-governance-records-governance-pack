  "context": [
    "ISO/IEC 27018 defines public-cloud PII protection controls and related evidence context.",
    "Cloud PII protection evidence can be required when privacy governance records involve public-cloud processors or services."
  ],
  "decision": [
    "Use ISO/IEC 27018 when a downstream system governs public-cloud PII protection evidence.",
    "Preserve cloud service context, PII protection control context, obligation, evidence artifact, reviewer, and timestamp where used."
  ],
  "authority_sources": [
    "ISO/IEC 27018 Public-cloud PII protection"
  ],
  "consequences": [
