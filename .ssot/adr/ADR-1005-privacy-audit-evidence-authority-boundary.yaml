body: |-
  ## Context
  
  ISO/IEC 27701 defines privacy information management system controls and privacy management evidence context. ISO/IEC 27018 defines public-cloud PII protection controls. Privacy governance records often require evidence that policies, notices, consent records, processing records, and controls were reviewed or operated.
  
  ## Decision
  
  Privacy audit evidence source curation covers PIMS evidence, public-cloud PII protection evidence, control evidence, reviewer context, timestamp context, retention context, and accountability traceability. Audit evidence targets must remain separate from notices, consent records, consent receipts, and DPV processing records unless explicit linkage targets are curated.
  
  ## Authority Sources
  
  - ISO/IEC 27701 Privacy Information Management System.
  - ISO/IEC 27018 Public-cloud PII protection.
