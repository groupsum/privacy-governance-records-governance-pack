body: |-
  ## Context
  
  W3C Data Privacy Vocabulary provides vocabulary for describing processing, purposes, personal data categories, legal bases, recipients, rights, risks, measures, and related privacy governance concepts.
  
  ## Decision
  
  DPV source curation covers processing record vocabulary targets, including purpose, processing, legal basis, personal data category, data subject, recipient, rights, risks, safeguards, and technical or organizational measures. DPV targets must remain vocabulary targets and must not be treated as complete consent receipt or audit evidence records unless explicit mapping targets are curated.
  
  ## Authority Sources
  
  - W3C Data Privacy Vocabulary.
