body: |-
  ## Purpose
  
  Define pack-local requirements for curating online privacy notice targets.
  
  ## Requirements
  
  - Privacy notice targets MUST preserve notice identity, notice version, notice content, notice presentation context, timing, accessibility, and update semantics where applicable.
  - Consent request targets SHOULD preserve the relationship between a notice, the requested consent, the affected purposes, and available withdrawal mechanisms.
  - Privacy notice targets MUST remain separate from consent record and DPV processing targets unless explicit linkage targets are curated.
  - Notice evidence SHOULD preserve enough context to show which notice version was presented or made available.
  
  ## Authority Sources
  
  - ISO/IEC 29184 Online privacy notices and consent.
